name: Native fuzzing

on:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  NIGHTLY_TOOLCHAIN: "nightly-2026-07-15"

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [parser_bytes, integer_list_roundtrip]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal
      - run: cargo +"$NIGHTLY_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - run: cargo +"$NIGHTLY_TOOLCHAIN" fuzz build --fuzz-dir fuzz ${{ matrix.target }}
      - run: cargo +"$NIGHTLY_TOOLCHAIN" fuzz run --fuzz-dir fuzz ${{ matrix.target }} -- -max_total_time=20

  sustained:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [parser_bytes, integer_list_roundtrip]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal
      - run: cargo +"$NIGHTLY_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - run: uv run --no-sync python scripts/seed_fuzz_corpus.py
      - run: cargo +"$NIGHTLY_TOOLCHAIN" fuzz run --fuzz-dir fuzz ${{ matrix.target }} -- -max_total_time=900
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts/
          if-no-files-found: warn
