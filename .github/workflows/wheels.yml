name: Build and publish wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the completed matrix to PyPI
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.name }} / ${{ matrix.python.label }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64
            python_arch: x64
            manylinux: "2_17"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            python_arch: arm64
            manylinux: "2_17"
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            python_arch: x64
            manylinux: off
          - name: macos-aarch64
            runner: macos-14
            target: aarch64
            python_arch: arm64
            manylinux: off
          - name: windows-x86_64
            runner: windows-latest
            target: x64
            python_arch: x64
            manylinux: off
          - name: windows-aarch64
            runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            manylinux: off
        python:
          - label: abi3
            version: "3.13"
            interpreter: python3.13
          - label: cp314t
            version: "3.14t"
            interpreter: python3.14t

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python.version }}
          architecture: ${{ matrix.platform.python_arch }}

      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release
            --locked
            --compatibility pypi
            --out dist
            -i ${{ matrix.python.interpreter }}

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install msgspec==0.21.1
          python -m pip install --no-index --find-links dist --no-deps msgspec-toon

      - name: Smoke test
        shell: bash
        run: |
          python -c "import msgspec_toon as toon; wire = toon.encode({'x': 1}); assert toon.decode(wire) == {'x': 1}"

      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wheel-${{ matrix.platform.name }}-${{ matrix.python.label }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build source distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.11.5
          command: sdist
          args: --out dist

      - name: Upload source distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-22.04
    needs: [wheels, sdist]
    if: >-
      ${{ startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Publish release
        run: >-
          uv publish
          --trusted-publishing never
          --check-url https://pypi.org/simple/
          dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_KEY }}
