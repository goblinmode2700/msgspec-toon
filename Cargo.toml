[package]
name = "msgspec-toon-native"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py313"] }
itoa = "1.0"
memchr = "2.7"
ryu = "1.0"
smallvec = "1.15"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true
