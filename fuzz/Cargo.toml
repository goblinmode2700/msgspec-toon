[package]
name = "msgspec-toon-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
memchr = "=2.8.3"
rustc-hash = "=2.1.3"
smallvec = "=1.15.2"

[[bin]]
name = "parser_bytes"
path = "fuzz_targets/parser_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "integer_list_roundtrip"
path = "fuzz_targets/integer_list_roundtrip.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
