[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "msgspec-toon"
version = "0.2.0b3"
description = "A native TOON 4.1 codec with direct msgspec.Struct decoding"
requires-python = ">=3.13"
dependencies = ["msgspec==0.21.1"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[dependency-groups]
bench = [
    "python-toon==0.1.3",
    "tiktoken>=0.13.0",
    "toons>=0.7.0",
]
dev = [
  "maturin>=1.9,<2",
  "pytest>=8.4",
  "pytest-benchmark>=5.1",
  "ruff>=0.12",
  "mypy>=1.17",
]

[tool.uv]
# Supply-chain cooldown: every resolution refuses artifacts uploaded within
# the last 14 days. Per-package CVE escape hatch: exclude-newer-package
# (e.g. { somepkg = "0 days" }) with the justification in the commit.
exclude-newer = "14 days"
default-groups = ["dev"]

[tool.maturin]
python-source = "python"
module-name = "msgspec_toon._native"
bindings = "pyo3"
features = ["extension-module"]
strip = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
files = ["python/msgspec_toon"]

[[tool.mypy.overrides]]
module = "msgspec_toon._native"
ignore_missing_imports = true
